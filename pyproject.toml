[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-codex"
version = "0.13.0"
description = "Task delivery with direct Codex execution, reusable data programs and optional agents"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
agentforge = "agentforge.__main__:main"

[tool.setuptools.packages.find]
include = ["agentforge*"]

[tool.setuptools.package-data]
agentforge = ["web/*.html", "web/*.css", "web/*.js", "benchmarks/*.json"]
